name: Maintenance smoke

# A separate, read-only entrypoint for release and docs tooling. Productive
# release.yml and deploy-docs.yml retain their existing triggers.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            go.sum
            cmd/graymatter/go.sum

      # The replacement exists only in this ephemeral checkout. The tagged
      # modules and their go.mod files remain unchanged.
      - name: Build against the checked-out library
        working-directory: cmd/graymatter
        run: go mod edit -replace github.com/angelnicolasc/graymatter=../..

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Check GoReleaser configuration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          goreleaser check > "${RUNNER_TEMP}/goreleaser-check.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/goreleaser-check.log"
          if [ "$result" -eq 0 ]; then
            exit 0
          fi
          # v2.17.1 treats the existing Homebrew formula publisher as a
          # deprecation error. Keep its publishing contract unchanged here;
          # reject every other check failure, then validate all other fields.
          # GoReleaser emits ANSI styling on hosted runners even when its
          # output is redirected. Strip only terminal control sequences before
          # comparing the sole accepted deprecation.
          python3 - "${RUNNER_TEMP}/goreleaser-check.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(errors="replace")
          plain = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", raw)
          if (plain.count("DEPRECATED:") != 1 or
              not re.search(r"DEPRECATED:\s*brews\s*should not be used anymore", plain) or
              "configuration is valid, but uses deprecated properties" not in plain):
              raise SystemExit("GoReleaser check failed for a reason other than the known brews deprecation")
          PY
          echo "::warning file=.goreleaser.yml::GoReleaser check reports the existing brews deprecation; validating the remaining settings and the real snapshot."
          awk '/^brews:$/ { skip=1; next } /^scoops:$/ { skip=0 } !skip { print }' \
            .goreleaser.yml > "${RUNNER_TEMP}/goreleaser-check-no-brews.yml"
          goreleaser check "${RUNNER_TEMP}/goreleaser-check-no-brews.yml"

      - name: Build snapshot without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=sign

      - name: Verify five release targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifacts = json.loads(Path("dist/artifacts.json").read_text())
          archives = [a for a in artifacts if a.get("type") == "Archive"]
          expected = {
              ("linux", "amd64"), ("linux", "arm64"),
              ("darwin", "amd64"), ("darwin", "arm64"),
              ("windows", "amd64"),
          }
          actual = [(a.get("goos"), a.get("goarch")) for a in archives]
          if len(actual) != len(expected) or set(actual) != expected:
              raise SystemExit(f"snapshot archive targets: {actual!r}, want {sorted(expected)!r}")
          for artifact in archives:
              path = Path(artifact["path"])
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty snapshot archive: {path}")
          PY
          test -s dist/checksums.txt

  docs:
    name: Documentation dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install
        working-directory: www
        run: npm ci

      - name: Build
        working-directory: www
        run: npm run build

      # No Cloudflare credentials are supplied. The action must pass this
      # command through to the pinned Wrangler CLI without uploading.
      - name: Validate Wrangler action and bundle
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: 4.125.0
          workingDirectory: www
          command: deploy --dry-run --outdir ${{ runner.temp }}/wrangler-dry-run

  fuzz:
    name: Fuzz targets (10s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: |
            go.sum
            cmd/graymatter/go.sum

      - name: Build against the checked-out library
        working-directory: cmd/graymatter
        run: go mod edit -replace github.com/angelnicolasc/graymatter=../..

      - name: Fuzz Tokenize
        run: go test -run xxx -fuzz FuzzTokenize -fuzztime 10s ./pkg/memory/

      - name: Fuzz UnmarshalFact
        run: go test -run xxx -fuzz FuzzUnmarshalFact -fuzztime 10s ./pkg/memory/

      - name: Fuzz KeywordScore
        run: go test -run xxx -fuzz FuzzKeywordScore -fuzztime 10s ./pkg/memory/

      - name: Fuzz RenderBlock
        working-directory: cmd/graymatter
        run: go test -run xxx -fuzz FuzzRenderBlock -fuzztime 10s ./internal/contextblock/

      - name: Upload crash corpus on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-corpus-smoke
          path: |
            pkg/memory/testdata/fuzz
            cmd/graymatter/internal/contextblock/testdata/fuzz
          archive: true
          retention-days: 14
          if-no-files-found: ignore

  artifacts-mutation:
    name: Artifact and mutation tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: |
            go.sum
            cmd/graymatter/go.sum

      - name: Install gremlins v0.5.0
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0

      # The nightly workflow measures score over the root module. This fast
      # dry run exercises installation, coverage analysis and JSON reporting.
      - name: Emit mutation report
        run: '"$(go env GOPATH)/bin/gremlins" unleash --dry-run --output mutation-report.json ./pkg/embedding'

      - name: Validate mutation report
        run: |
          test -s mutation-report.json
          python3 -m json.tool mutation-report.json >/dev/null

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-smoke
          path: mutation-report.json
          if-no-files-found: error
          retention-days: 14

      # Reproduce the conditional crash-corpus upload with a harmless fixture.
      - name: Create corpus fixture
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/fuzz-corpus/FuzzTokenize"
          printf 'go test fuzz v1\n[]byte("smoke")\n' > "${RUNNER_TEMP}/fuzz-corpus/FuzzTokenize/smoke"

      - name: Upload corpus fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-fixture
          path: ${{ runner.temp }}/fuzz-corpus
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Download corpus fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fuzz-corpus-fixture
          path: ${{ runner.temp }}/downloaded-corpus
          digest-mismatch: error

      - name: Verify corpus integrity
        shell: bash
        run: cmp "${RUNNER_TEMP}/fuzz-corpus/FuzzTokenize/smoke" "${RUNNER_TEMP}/downloaded-corpus/FuzzTokenize/smoke"
